<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Mock Visa Centre{% endblock %}</title>
<style>
  body { font-family: sans-serif; margin: 0; background: #f4f4f4; color: #222; }
  .banner { background: #fff3cd; border-bottom: 1px solid #e0c36a; padding: 8px 16px; font-size: 14px; }
  main { max-width: 480px; margin: 24px auto; background: #fff; padding: 24px; border: 1px solid #ccc; }
  label { display: block; margin: 12px 0 4px; }
  input, select { width: 100%; padding: 8px; box-sizing: border-box; }
  button, a[role=button] { display: inline-block; margin-top: 16px; padding: 8px 16px; border: 1px solid #555;
    background: #eee; color: #222; text-decoration: none; cursor: pointer; font-size: 14px; }
  .alert { margin-top: 16px; padding: 12px; border: 1px solid #888; background: #eef; }
  .error { color: #a00; }
</style>
</head>
<body>
<div class="banner">Mock VFS — test site, not affiliated with VFS Global</div>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
