services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: alay
      POSTGRES_PASSWORD: alay
      POSTGRES_DB: alay
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alay"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
