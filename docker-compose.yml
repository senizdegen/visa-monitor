x-env-file: &env-file
  - path: .env
    required: false

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://alay:alay@postgres:5432/alay
  EVIDENCE_DIR: /data/evidence

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: alay
      POSTGRES_PASSWORD: alay
      POSTGRES_DB: alay
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alay"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: {context: ., target: runtime}
    command: ["sh", "-c", "alembic upgrade head && python -m alay.sync_adapters"]
    restart: "no"
    env_file: *env-file
    environment:
      <<: *app-env
      ADAPTERS_FILE: /app/adapters.yaml
    volumes:
      - ./adapters.yaml:/app/adapters.yaml:ro
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build: {context: ., target: runtime}
    command: ["uvicorn", "alay.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    env_file: *env-file
    environment: *app-env
    volumes:
      - evidence:/data/evidence
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    build: {context: ., target: runtime}
    command: ["python", "-m", "alay.worker"]
    stop_grace_period: 75s   # SHUTDOWN_GRACE_S is 60; Docker's default 10s would SIGKILL mid-drain
    env_file: *env-file
    environment: *app-env
    volumes:
      - evidence:/data/evidence
    depends_on:
      migrate: {condition: service_completed_successfully}
      mock-vfs: {condition: service_started}

  mock-vfs:
    build: {context: ., target: runtime}
    command: ["uvicorn", "alay.mock_vfs.app:app", "--host", "0.0.0.0", "--port", "8081"]
    env_file: *env-file
    ports:
      - "8081:8081"

  tests:
    profiles: ["tests"]
    build: {context: ., target: test}
    command: ["pytest", "-p", "no:cacheprovider"]
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://alay:alay@postgres:5432/alay_test
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  pgdata:
  evidence:
